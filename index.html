<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kalkulator Patungan</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="card">
        <h2>Kalkulator Patungan</h2>
        <p>Hitung pembagian tagihan & tip</p>

        <div class="form-group">
            <label>Total Tagihan (Rp)</label>
            <input type="number" id="totalTagihan" placeholder="misal: 150000">
        </div>

        <div class="form-group">
            <label>Tip (%)</label>
            <input type="number" id="persenTip" placeholder="0" value="0">
        </div>

        <div class="form-group">
            <label>Jumlah Orang</label>
            <input type="number" id="jumlahOrang" value="1">
        </div>

        <button id="btnHitung" onclick="hitungPatungan()">Hitung</button>

        <div id="hasilBox" class="hasil-container" style="display: none;">
            <p>Masing-masing bayar:</p>
            <h3 id="nominalPerOrang">Rp 0</h3>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
